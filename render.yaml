services:
  - type: web
    name: app-review-monitoring-api
    runtime: go
    plan: free
    branch: main
    rootDir: masterfabric-go
    buildCommand: go build -tags netgo -ldflags '-s -w' -o server ./cmd/server
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GO_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://mlc-llm-monitoring.vercel.app,https://app-review-monitoring.vercel.app
      - key: MLC_LLM_ENABLED
        sync: false
      - key: MLC_LLM_BASE_URL
        sync: false
      - key: MLC_LLM_API_KEY
        sync: false
      - key: METRICS_ENABLED
        value: "true"
      - key: STORE_WORKER_URL
        sync: false
      - key: AUDIT_MAX_REVIEWS
        value: "10000"
      - key: AUDIT_QUICK_REVIEW_CAP
        value: "500"
      - key: AUDIT_BATCH_SIZE
        value: "8"
      - key: AUDIT_CLASSIFY_WORKERS
        value: "4"

  - type: web
    name: inferreview-store-worker
    runtime: python
    plan: free
    branch: main
    rootDir: masterfabric-go/deployments/store-worker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STORE_DEFAULT_LANG
        value: tr
      - key: STORE_DEFAULT_COUNTRY
        value: tr
