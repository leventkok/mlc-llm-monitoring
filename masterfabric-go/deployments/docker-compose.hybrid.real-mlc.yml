# Real MLC GPU stack — use with docker-compose.hybrid.yml (mock stays default without this file).
#
#   docker compose -f docker-compose.hybrid.yml -f docker-compose.hybrid.real-mlc.yml \
#     --env-file .env.hybrid --profile tunnel up --build
#
# Requires NVIDIA GPU + Container Toolkit (see REAL-MLC.md).

services:
  mlc-engine:
    build:
      context: ./mlc-engine
      dockerfile: Dockerfile
      args:
        MLC_WHEEL_SUFFIX: ${MLC_WHEEL_SUFFIX:-cu130}
    command:
      - ${MLC_MODEL:-HF://mlc-ai/gemma-2-2b-it-q4f16_1-MLC}
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
      - --device
      - ${MLC_DEVICE:-cuda}
    environment:
      HF_HOME: /models
      CUDA_HOME: /usr/local/cuda
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64
      TORCH_CUDA_ARCH_LIST: "8.6"
      MLC_JIT_POLICY: ${MLC_JIT_POLICY:-ON}
      MLC_LORA_ADAPTER: ${MLC_LORA_ADAPTER:-}
      MLC_BASE_MODEL: ${MLC_BASE_MODEL:-google/gemma-2-2b-it}
      MLC_QUANTIZATION: ${MLC_QUANTIZATION:-q4f16_1}
      MLC_CONV_TEMPLATE: ${MLC_CONV_TEMPLATE:-gemma_instruction}
      MAX_JOBS: "4"
    shm_size: "2gb"
    volumes:
      - mlc_models:/models
      - mlc_jit_cache:/root/.cache/mlc_llm
      - ./peft-adapters:/adapters
    expose:
      - "8081"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 900s

  mlc-llm:
    build:
      context: ./mlc-proxy
      dockerfile: Dockerfile
    environment:
      MLC_API_KEY: ${MLC_API_KEY:-}
      MLC_UPSTREAM: http://mlc-engine:8081
    depends_on:
      mlc-engine:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 900s

volumes:
  mlc_models:
  mlc_jit_cache:
